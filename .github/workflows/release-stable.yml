name: Release Stable

on:
  push:
    branches:
      - main
    paths:
      - 'src/manifest.json'

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    if: "${{ startsWith(github.event.head_commit.message, 'chore: release version') }}"
    runs-on: ubuntu-24.04
    name: Release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Environment setup
        uses: ./.github/actions/setup

      - name: Build
        run: pnpm build --channel=stable

      - name: Get built version
        uses: actions/github-script@v9
        id: version
        with:
          script: |
            const { default: script } = await import('${{ github.workspace }}/.github/actions/get-built-version.ts')
            await script({ github, context, core })

      - name: Delete existing release # To keep the workflow idempotent.
        run: gh release delete "v${RELEASE_VERSION}" --cleanup-tag --yes
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}

      - name: Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          files: |
            dist/*.zip
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          prerelease: false
          fail_on_unmatched_files: true

      # - name: Upload to stores
      #   run: |
      #     echo 'TODO'
